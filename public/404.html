<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect: converts the path into a query string
      // so index.html can restore it before the app mounts.
      var repo = '/TEMPL-vayutra-moving-company';
      var path = window.location.pathname;
      if (path.startsWith(repo)) {
        path = path.slice(repo.length);
      }
      window.location.replace(
        repo + '/?p=' + encodeURIComponent(path + window.location.search) + window.location.hash
      );
    </script>
  </head>
  <body></body>
</html>

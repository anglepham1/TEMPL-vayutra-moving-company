  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA: restore the real path from the 404.html redirect
      (function () {
        var q = window.location.search.match(/[?&]p=([^&]+)/);
        if (q) {
          var path = decodeURIComponent(q[1]);
          window.history.replaceState(null, '', '/TEMPL-vayutra-moving-company' + path + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
